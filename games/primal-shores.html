const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=(x,y)=>{const l=Math.hypot(x,y)||1;return {x:x/l,y:y/l};};
const angDiff=(a,b)=>{const d=a-b;return Math.atan2(Math.sin(d),Math.cos(d));};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function resize(){
  const a=clamp(innerWidth/Math.max(1,innerHeight),1.25,2.1);VW=Math.round(VH*a);cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;
  const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
}

addEventListener('keydown',e=>{Snd.init();if(e.ctrlKey||e.metaKey||e.altKey)return;const k=kname(e);if(k.length===1||['space','tab','esc','shift','enter'].includes(k))e.preventDefault();if(!e.repeat)pressed[k]=true;keys[k]=true;});

function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/Math.max(1,r.width)*VW;mouse.y=(e.clientY-r.top)/Math.max(1,r.height)*VH;}

const Snd={ctx:null,out:null,on:true,nb:null,
  init(){if(this.ctx){if(this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}return;}
    try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.out=this.ctx.createGain();this.out.gain.value=.28;this.out.connect(this.ctx.destination);
      const n=this.ctx.sampleRate*.5|0;this.nb=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){this.ctx=null;}},
  tone(f,d,type,vol,slide,delay){if(!this.ctx||!this.on)return;try{const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+d+.03);}catch(e){}},
  noise(d,vol,delay,freq){if(!this.ctx||!this.nb||!this.on)return;try{const c=this.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=this.nb;f.type='lowpass';f.frequency.value=freq||1800;
    g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(this.out);s.start(t);s.stop(t+d+.03);}catch(e){}},
  play(n){const s=this;switch(n){
    case'swing':s.noise(.08,.1,0,3500);break;case'chop':s.noise(.07,.16,0,900);s.tone(150,.06,'square',.08,-60);break;
    case'rock':s.noise(.05,.16,0,4000);s.tone(700,.04,'triangle',.08,-300);break;case'hit':s.tone(180,.08,'square',.12,-100);s.noise(.07,.12);break;
    case'hurt':s.tone(230,.2,'sawtooth',.18,-160);break;case'pick':s.tone(880,.05,'square',.06);s.tone(1175,.08,'square',.06,0,.05);break;
    case'craft':[523,659,784].forEach((f,i)=>s.tone(f,.1,'square',.08,0,i*.07));break;case'eat':s.noise(.06,.1,0,1200);s.noise(.06,.1,.1,1200);break;
    case'drink':s.tone(400,.12,'sine',.1,300);s.tone(500,.12,'sine',.1,300,.14);break;case'shoot':s.tone(700,.1,'triangle',.1,-400);break;
    case'level':[392,523,659,784,1047].forEach((f,i)=>s.tone(f,.16,'triangle',.12,0,i*.08));break;case'tame':[523,659,784,988,1175,1568].forEach((f,i)=>s.tone(f,.2,'triangle',.12,0,i*.1));break;
    case'roar':s.tone(110,.6,'sawtooth',.2,-50);s.noise(.6,.18,0,500);break;case'ko':s.tone(300,.5,'sine',.14,-220);break;
    case'fail':s.tone(300,.15,'square',.1,-120);break;case'place':s.noise(.1,.14,0,500);s.tone(200,.08,'square',.08);break;
    case'ui':s.tone(660,.05,'square',.05);break;case'boom':s.noise(.45,.28,0,500);s.tone(80,.4,'sine',.28,-40);break;
    case'squawk':s.tone(900,.08,'square',.07,-300);break;}}};
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10],seq=s=>s.split(' ').map(x=>x==='-'?null:+x);
const Music={cur:null,step:0,next:0,on:true,
  tr:{day:{bpm:84,root:57,sc:MAJ,w:'triangle',mel:seq('0 - - 2 4 - - - 7 - 4 - 2 - - - 5 - - 4 2 - - - 0 - 2 - -1 - - -'),bass:seq('0 - - - 3 - - - 4 - - - 0 - - -')},
      night:{bpm:66,root:50,sc:MIN,w:'sine',mel:seq('0 - - - 3 - - - 2 - - - - - - - 4 - - - 3 - - - 0 - - - - - - -'),bass:seq('0 - - - - - - - -2 - - - - - - -')},
      danger:{bpm:140,root:45,sc:MIN,w:'sawtooth',mel:seq('0 0 7 0 6 0 5 0 4 0 5 0 6 4 2 1'),bass:seq('0 - 0 - 0 - 0 - -2 - -2 - -3 - -3 -')}},
  set(n){if(this.cur!==n){this.cur=n;this.step=0;this.next=0;}},
  update(){const c=Snd.ctx;if(!c||!this.on||!this.cur)return;const tr=this.tr[this.cur],sp=60/tr.bpm/2;if(this.next<c.currentTime)this.next=c.currentTime+.05;let g=0;
    while(this.next<c.currentTime+.25&&g++<8){const i=this.step,dl=this.next-c.currentTime,m=tr.mel[i%tr.mel.length],b=tr.bass[i%tr.bass.length];
      const fq=(d,o)=>{const k=((d%7)+7)%7,oc=Math.floor(d/7);return 440*Math.pow(2,(tr.root+tr.sc[k]+12*(oc+o)-69)/12);};
      if(m!==null)Snd.tone(fq(m,0),sp*1.7,tr.w,.035,0,dl);if(b!==null)Snd.tone(fq(b,-2),sp*1.9,'triangle',.05,0,dl);this.step++;this.next+=sp;}}};

// ---- collision ----  mode: 'p' player, 'd' land dinosaur, 's' swimmer, 'f' flyer
function blockedAt(x,y,r,mode){
  if(x<r||y<r||x>WORLD-r||y>WORLD-r)return true;if(mode==='f')return false;
  for(let i=0;i<4;i++){const px=x+(i&1?r:-r),py=y+(i&2?r:-r),tx=Math.floor(px/TS),ty=Math.floor(py/TS),t=tileAt(tx,ty);
    if(mode==='s'){if(t>1)return true;continue;}
    if(mode==='d'&&t===0)return true;
    const s=W.sgrid.get(tx+ty*N);if(s){const sv=SOLIDST[s.k];if(sv===1||(sv===2&&mode!=='p'))return true;}}

function mkPlayer(){return {x:W.spawn.x,y:W.spawn.y,cr:7,r:8,hp:100,stam:100,food:100,water:100,lvl:1,xp:0,pts:0,st:{hp:0,stam:0,food:0,water:0,weight:0,melee:0,speed:0,fort:0},

const maxHP=()=>100+10*P.st.hp,maxStam=()=>100+10*P.st.stam,maxFood=()=>100+10*P.st.food,maxWater=()=>100+10*P.st.water;
const maxWeight=()=>100+25*P.st.weight+(P.mount?SP[P.mount.sp].carry:0);
function invWeight(){let w=0;for(const k in P.inv)w+=IT[k].w*P.inv[k];return w;}
const has=(id,n)=>(P.inv[id]||0)>=(n||1);
function addItem(id,n,quiet){if(n<=0)return;P.inv[id]=(P.inv[id]||0)+n;const it=IT[id];
  if(!P.hot.includes(id)&&(it.tool||it.st||id==='berry'||id==='meat')){const i=P.hot.indexOf(null);if(i>=0)P.hot[i]=id;}
  if(!quiet){const last=texts[texts.length-1],s='+'+n+' '+it.n;if(!(last&&last.s===s&&last.t>.7))addText(P.x+rnd(-14,14),P.y-34-rnd(0,14),s,'#ffe9a0');}}
function take(id,n){n=n||1;P.inv[id]=(P.inv[id]||0)-n;if(P.inv[id]<=0){delete P.inv[id];const i=P.hot.indexOf(id);if(i>=0)P.hot[i]=null;}}
function gainXP(n){if(P.lvl>=MAXLVL)return;P.xp+=n;
  while(P.lvl<MAXLVL&&P.xp>=xpNeed(P.lvl)){P.xp-=xpNeed(P.lvl);P.lvl++;P.pts++;Snd.play('level');burst(P.x,P.y-10,'#ffe066',24,120);

function nearStruct(kinds,rad){return W.structs.some(s=>kinds.includes(s.k)&&dist(P.x,P.y,s.x,s.y)<rad);}
function nearWater(){for(const o of [[0,0],[22,0],[-22,0],[0,22],[0,-22]])if(tileAtPx(P.x+o[0],P.y+o[1])<=1)return true;return false;}
function hurtPlayer(dmg,raw,src){
  if(P.dead||G.state==='win')return;

  if(!raw){dmg*=100/(100+2*((P.armor&&IT[P.armor].armor)||0));if(P.lvl<4)dmg*=.5; // go easy on brand-new survivors
   addText(P.x,P.y-30,'-'+Math.max(1,Math.round(dmg)),'#ff5a5a');Snd.play('hurt');shake(4);burst(P.x,P.y-10,'#e0412e',6,80);}

function die(){

  if(G.bag)for(const k in G.bag.inv)inv[k]=(inv[k]||0)+G.bag.inv[k];
  if(Object.keys(inv).length)G.bag={x:P.x,y:P.y,inv};

}

const FIST={type:'fist',dmg:8,cd:.4,reach:34,pw:8,torp:6};
function heldItem(){const id=P.hot[P.sel];return id&&has(id)?IT[id]:null;}
function overUI(){return mouse.y>VH-40&&Math.abs(mouse.x-VW/2)<124;}
function updatePlayer(dt){
  const m=P.mount,inp=G.state==='play';
  P.cd-=dt;P.swing-=dt;P.hurtT-=dt;P.slow-=dt;
  const wx=mouse.x+cam.x,wy=mouse.y+cam.y;
  if(inp){P.ang=Math.atan2(wy-(P.y-8),wx-P.x);const c=Math.cos(P.ang),s=Math.sin(P.ang);P.dir=Math.abs(c)>Math.abs(s)?(c<0?1:2):(s<0?3:0);}
  let mx=inp?(K_('d')?1:0)-(K_('a')?1:0):0,my=inp?(K_('s')?1:0)-(K_('w')?1:0):0;const moving=mx||my;if(mx&&my){mx*=.707;my*=.707;}
  const t=tileAtPx(P.x,P.y),deep=t===0&&!m,over=invWeight()>maxWeight();let sprint=false;
  G.warn=[];
  if(m){const S=SP[m.sp],sp=S.spd*1.15*(over?.4:1);
    if(inp&&S.fly&&P_('space')){if(!m.air){m.air=true;Snd.play('squawk');toast('You take off! Press SPACE over land to come down.');}else if(t>=1){m.air=false;}else toast('You cannot land on deep water.');}
    if(moving){moveEnt(m,mx*sp*dt,my*sp*dt,m.air?'f':'d');m.mv=true;if(mx)m.face=mx<0?-1:1;}
    P.x=m.x;P.y=m.y;P.stam=Math.min(maxStam(),P.stam+12*dt);}
  else{
    sprint=K_('shift')&&moving&&P.stam>0&&!over;
    const sp=110*(1+.025*P.st.speed)*(sprint?1.55:1)*(deep?.6:t===1?.82:1)*(over?.35:1)*(P.slow>0?.55:1);
    if(moving){moveEnt(P,mx*sp*dt,my*sp*dt,'p');P.walk+=dt*(sprint?14:9);}
    if(sprint)P.stam-=14*dt;else if(deep)P.stam-=6*dt;else P.stam=Math.min(maxStam(),P.stam+(moving?10:18)*dt);
    if(P.stam<0)P.stam=0;
    if(deep&&P.stam<=0){hurtPlayer(9*dt,true);G.warn.push('DROWNING! Swim to land');}
    else if(deep)G.warn.push('Swimming (uses stamina)');
  }
  if(P.dead)return;
  // hunger, thirst, cold
  const fr=(1-.04*P.st.fort)*(sprint?1.6:1);P.food=Math.max(0,P.food-.2*dt*fr);P.water=Math.max(0,P.water-.27*dt*fr);
  if(P.food<=0){hurtPlayer(2*dt,true);G.warn.push('STARVING! Eat something');}else if(P.food<25)G.warn.push('Hungry');
  if(P.water<=0){hurtPlayer(2*dt,true);G.warn.push('DEHYDRATED! Drink water (E at the shore)');}else if(P.water<25)G.warn.push('Thirsty');
  const held=heldItem(),warm=(P.armor&&IT[P.armor].warm)||nearStruct(['campfire','forge'],90)||(held&&held.tool&&held.tool.light);
  if(t===7&&!warm){hurtPlayer(1.6*(1-.1*P.st.fort)*dt,true);G.warn.push('FREEZING! Wear Hide Armor or stand by a fire');}
  if(over)G.warn.push('TOO HEAVY! Drop things in a Storage Box');
  if(P.dead)return;
  if(P.food>20&&P.water>20&&P.hurtT<=0)P.hp=Math.min(maxHP(),P.hp+.9*dt);
  if(G.bag&&dist(P.x,P.y,G.bag.x,G.bag.y)<22){for(const k in G.bag.inv)addItem(k,G.bag.inv[k],true);G.bag=null;Snd.play('pick');toast('You got your things back.','#7dff8a');}
  if(!inp)return;
  for(let i=0;i<8;i++)if(P_(String(i+1)))P.sel=i;
  if(mouse.wheel){P.sel=(P.sel+Math.sign(mouse.wheel)+8)%8;}
  if(P_('e'))interact();if(P_('f'))quickRide();if(P_('x'))pickupStruct();
  if(P_('y'))whistle('follow');if(P_('u'))whistle('stay');
  const mt=P.mount;if(G.state!=='play')return;
  G.place=!mt&&held&&held.st?held.id:null;
  if(overUI()){if(mouse.click){const i=Math.floor((mouse.x-(VW/2-120))/30);if(i>=0&&i<8)P.sel=i;}return;}
  if(mt){if(mouse.down&&P.cd<=0)mountAttack();}
  else if(G.place){if(mouse.click)tryPlace();}
  else if(held&&held.food){if(mouse.click)eat(held.id);}
  else if(held&&held.tool&&held.tool.ranged){if(mouse.down&&P.cd<=0)shoot(held.tool);}
  else if(mouse.down&&P.cd<=0)melee(held&&held.tool?held.tool:FIST);
}
function eat(id){const it=IT[id];if(!has(id))return;take(id);P.food=Math.min(maxFood(),P.food+it.food);if(it.water)P.water=Math.min(maxWater(),P.water+it.water);
  if(it.hp){if(it.hp<0){hurtPlayer(-it.hp,true);toast('Raw meat makes you sick. Cook it at a campfire!','#ff8a8a');}else P.hp=Math.min(maxHP(),P.hp+it.hp);}
  Snd.play('eat');G.flags.ate=1;}
function melee(T){
  P.cd=T.cd;P.swing=.16;Snd.play('swing');
  const a=P.ang,dm=T.dmg*(1+.06*P.st.melee),py=P.y-8;let hit=false;
  for(const d of dinos){if(d.dead||d.tamed)continue;const cy=d.y-d.r*.6,dd=dist(P.x,py,d.x,cy);if(dd>T.reach+d.r)continue;
    if(Math.abs(angDiff(Math.atan2(cy-py,d.x-P.x),a))>1&&dd>d.r)continue;

function harvest(n,T){
  const ty=T.type,tier=T.tier||1,got={},sayOnce=(k,s)=>{if(!G.flags[k]){G.flags[k]=1;toast(s,'#9fe0ff',5);}};
  if(n.k==='tree'){if(ty==='hatchet'){got.wood=3;got.thatch=1;}else if(ty==='pick'){got.thatch=3;got.wood=1;}else if(ty==='dino'){got.wood=4;got.thatch=6;}else{got.thatch=1;if(Math.random()<.4)got.wood=1;}Snd.play('chop');burst(n.x,n.y-24,'#49a84f',4,70);}
  else if(n.k==='rock'){if(ty==='hatchet')got.stone=3;else if(ty==='pick'){got.flint=2;got.stone=1;}else if(ty==='dino')got.stone=4;else if(ty==='fist'){got.stone=1;sayOnce('t_rock','Fists only get a little Stone. Craft a Pick (TAB) to get Flint too.');}else{sayOnce('t_rock2','Use a Pick or Hatchet on rocks.');return;}Snd.play('rock');burst(n.x,n.y-8,'#aaa59d',4,70);}
  else if(n.k==='metal'){if(ty==='pick'){got.metal=2;got.stone=1;}else{sayOnce('t_metal','You need a Pick to mine Metal.');Snd.play('rock');return;}Snd.play('rock');burst(n.x,n.y-8,'#ffe27a',5,80);}
  else if(n.k==='carcass'){let me=1,hi=Math.random()<.5?1:0;if(ty==='hatchet'){hi=2;me=1;}else if(ty==='pick'){me=2;hi=1;}else if(ty==='dino'){me=4;hi=2;}
    me=Math.min(n.meat,me*tier);hi=Math.min(n.hide,hi*tier);n.meat-=me;n.hide-=hi;if(me)got.rawmeat=me;if(hi)got.hide=hi;Snd.play('hit');burst(n.x,n.y-6,'#e04a5a',4,60);
    if(n.meat<=0&&n.hide<=0)n.hp=0;else n.hp=999;G.flags.meat=1;}
  for(const k in got)addItem(k,got[k]*(n.k==='carcass'?1:tier));
  n.sh=.15;if(n.k!=='carcass')n.hp-=T.pw;gainXP(1);
  if(n.hp<=0){removeNode(n,true);burst(n.x,n.y-10,n.k==='tree'?'#6b4423':'#8f8a84',12,110);}
}
function gatherBush(n,mult){

  n.hp-=mult>1?3:1;n.sh=.2;Snd.play('pick');gainXP(1);G.flags.bush=1;burst(n.x,n.y-8,'#49a84f',5,60);if(n.hp<=0)removeNode(n,true);

}
function mountAttack(){

  for(const d of dinos){if(d.dead||d.tamed)continue;const dy=d.y-d.r*.6,dd=dist(m.x,cy,d.x,dy);if(dd>m.r+d.r+30)continue;if(Math.abs(angDiff(Math.atan2(dy-cy,d.x-m.x),a))>1.1&&dd>m.r+d.r)continue;hurtDino(d,m.dmg,m);hit=true;}

function findInteract(){

  let best=null,bd=1e9,kind='';const c=(k,o,d,max)=>{if(d<max&&d<bd){bd=d;best=o;kind=k;}};

function updateDino(d,dt){

function spawnTick(dt){

    const a=rnd(6.283),rr=rnd(Math.hypot(VW,VH)*.5+70,1000),x=P.x+Math.cos(a)*rr,y=P.y+Math.sin(a)*rr;if(x<40||y<40||x>WORLD-40||y>WORLD-40)continue;

    const S=SP[sp],ds=dist(x,y,W.spawn.x,W.spawn.y);
    if(ds<750&&S.ag===2&&sp!=='dilo'&&sp!=='piranha')continue; // the starting beach is (fairly) safe
    if(W.structs.some(s=>dist(x,y,s.x,s.y)<260))continue;
    const n=sp==='raptor'||sp==='dodo'?rndi(1,3):1,lvl=clamp(1+Math.floor(Math.random()*Math.random()*10)+Math.floor(ds/500)*2,1,30);
    for(let i=0;i<n;i++){const px=x+rnd(-40,40)*i,py=y+rnd(-40,40)*i;if(!blockedAt(px,py,10,S.swim?'s':S.fly?'f':'d'))mkDino(sp,px,py,lvl);}

function updateWorld(dt){
  G.time+=dt/DAYLEN;if(G.time>=1){G.time-=1;G.day++;toast('Day '+G.day+' begins.','#ffe9a0');}
  spawnTick(dt);
  for(const d of dinos){if(!d.dead)updateDino(d,dt);if(P.dead)break;}
  dinos=dinos.filter(d=>!d.dead);
  if(P.mount){P.x=P.mount.x;P.y=P.mount.y;}
  // projectiles
  for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.own==='p'){for(const d of dinos){if(d.dead||d.tamed)continue;if(dist(p.x,p.y,d.x,d.y-d.r*.6)<d.r+5){hurtDino(d,p.dmg,P,{torp:p.torp});Snd.play('hit');p.life=0;break;}}
      if(p.life>0){const s=structAt(Math.floor(p.x/TS),Math.floor(p.y/TS));if(s&&SOLIDST[s.k]===1)p.life=0;}}
    else if(!P.dead&&dist(p.x,p.y,P.x,P.y-8)<12){hurtPlayer(p.dmg,false,null);if(!P.mount){P.slow=2;}p.life=0;}}
  projs=projs.filter(p=>p.life>0);
  for(const h of hazards){h.t-=dt;if(h.t<=0){Snd.play('boom');shake(8);burst(h.x,h.y,'#c9a8ff',30,220);
    if(dist(h.x,h.y,P.x,P.y)<h.r)hurtPlayer(h.dmg,false,null);for(const d of dinos)if(d.tamed&&d!==P.mount&&dist(h.x,h.y,d.x,d.y)<h.r)hurtDino(d,h.dmg,null);}}
  hazards=hazards.filter(h=>h.t>0);

}

// ============================ SAVE / LOAD =============================
const SAVEKEY='primal_shores_v1';
function hasSave(){try{return !!localStorage.getItem(SAVEKEY);}catch(e){return false;}}
function saveGame(){
  if(!P||P.dead)return false;
  try{const p=Object.assign({},P,{mount:null,lastHit:null});
    const d={v:1,seed:W.seed,time:G.time,day:G.day,g:G.g,flags:G.flags,won:G.won,bag:G.bag,showGuide:G.showGuide,P:p,
      tames:dinos.filter(d=>d.tamed&&!d.dead).map(d=>({sp:d.sp,x:d.x,y:d.y,lvl:d.lvl,hp:d.hp,mhp:d.mhp,dmg:d.dmg,name:d.name,mode:d.mode,saddle:d.saddle,txp:d.txp})),
      structs:W.structs.map(s=>({k:s.k,tx:s.tx,ty:s.ty,hp:s.hp,inv:s.inv})),sites:W.sites.map(s=>({taken:s.taken,cleared:s.cleared}))};
    localStorage.setItem(SAVEKEY,JSON.stringify(d));return true;}catch(e){return false;}
}
function baseG(){return {state:'play',time:.12,day:1,g:0,flags:{},won:false,bag:null,warn:[],place:null,scroll:0,spT:0,slowT:0,saveT:45,showGuide:true,pd:null,chest:null};}
function clearFx(){dinos=[];projs=[];parts=[];texts=[];toasts=[];hazards=[];}
function newGame(){
  genWorld((Math.random()*1e9)|0);clearFx();P=mkPlayer();G=baseG();G.state='intro';G.it=gt;Music.set('day');
  for(let i=0;i<4;i++)mkDino('dodo',P.x+rnd(-260,260),P.y-rnd(60,220),1);
}
function loadGame(){
  try{const d=JSON.parse(localStorage.getItem(SAVEKEY));if(!d||!d.P)return false;
    genWorld(d.seed);clearFx();P=Object.assign(mkPlayer(),d.P);P.mount=null;P.lastHit=null;P.dead=false;
    for(const k in P.inv)if(!IT[k])delete P.inv[k];P.hot=P.hot.map(h=>IT[h]?h:null);
    G=Object.assign(baseG(),{time:d.time,day:d.day,g:d.g,flags:d.flags||{},won:d.won,bag:d.bag,showGuide:d.showGuide!==false});
    for(const s of d.structs||[]){if(!STHP[s.k])continue;addStruct(s.k,s.tx,s.ty,{hp:s.hp,inv:s.inv});nodesNear(s.tx*TS+16,s.ty*TS+16,40,n=>{if(Math.abs(n.x-s.tx*TS-16)<18&&Math.abs(n.y-6-s.ty*TS-16)<18)removeNode(n,false);});}
    (d.sites||[]).forEach((s,i)=>{if(W.sites[i]){W.sites[i].taken=s.taken;W.sites[i].cleared=s.cleared;}});
    for(const t of d.tames||[]){if(!SP[t.sp])continue;const n=mkDino(t.sp,t.x,t.y,t.lvl,{tamed:true,name:t.name,mode:t.mode||'follow',saddle:t.saddle,txp:t.txp||0});n.mhp=t.mhp;n.hp=t.hp;n.dmg=t.dmg;}
    Music.set('day');toast('Welcome back, survivor.','#7dff8a');return true;
  }catch(e){return false;}
}
function toTitle(){G={state:'title'};clearFx();Music.set('day');}

// ============================ MAIN LOOP ===============================
function update(dt){
  switch(G.state){
    case'play':
      if(P_('tab','i')){G.state='inv';G.scroll=0;Snd.play('ui');break;}
      if(P_('m')){G.state='map';Snd.play('ui');break;}
      if(P_('esc')){G.state='pause';break;}
      if(P_('g'))G.showGuide=!G.showGuide;
      updatePlayer(dt);if(!P.dead&&G.state!=='win')updateWorld(dt);break;
    case'tame':case'dino':{const d=G.pd;
      if(K_('w','a','s','d')||P_('esc','e')||!d||d.dead||dist(P.x,P.y,d.x,d.y)>d.r+70||(G.state==='tame'&&!d.ko)){G.state='play';break;}
      updatePlayer(dt);if(!P.dead)updateWorld(dt);break;}
    case'inv':case'chest':if(P_('tab','i','esc','e'))G.state='play';break;
    case'map':if(P_('m','esc'))G.state='play';break;
  }
  if(P){for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.t-=dt;}parts=parts.filter(q=>q.t>0);
    for(const q of texts){q.y-=26*dt;q.t-=dt;}texts=texts.filter(q=>q.t>0);
    for(const q of toasts)q.t-=dt;toasts=toasts.filter(q=>q.t>0);
    if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeA=0;}}
}
function draw(){
  const s=G.state;ctx.globalAlpha=1;
  if(s==='title')return drawTitle();
  if(s==='intro')return drawIntro();
  if(s==='help'&&!P){ctx.fillStyle='#1c2a20';ctx.fillRect(0,0,VW,VH);return drawHelp();}
  drawWorld();drawHUD();
  if(s==='inv')drawInv();else if(s==='chest')drawChest();else if(s==='tame'||s==='dino')drawDinoPanel();else if(s==='map')drawMap();
  else if(s==='pause')drawPause();else if(s==='help'){overlay(.7);drawHelp();}
  else if(s==='dead'){overlay(.7);tx('YOU DIED',VW/2,120,'#e8334a',34,'center');tx('Day '+G.day+'  ·  Level '+P.lvl,VW/2,170,'#ddd',11,'center');
    tx(G.bag?'Your things wait in a bag where you fell.':'',VW/2,190,'#ffe9a0',10,'center');tx('Your tamed dinosaurs and your buildings are safe.',VW/2,206,'#aaa',9,'center');
    if(gt-G.deadT>1&&btn(VW/2-70,240,140,26,P.bed?'Wake up at your mat':'Wake up on the beach',true,'#ffe066'))respawn();}
  else if(s==='win'){overlay(.72);tx('THE TITAN FALLS',VW/2,90,'#ffe066',30,'center');
    ['The Obelisk goes quiet. The island breathes out.','You came here with nothing. Now the giants walk beside you.','','Day '+G.day+'  ·  Level '+P.lvl+'  ·  '+dinos.filter(d=>d.tamed).length+' tamed dinosaurs'].forEach((l,i)=>tx(l,VW/2,150+i*18,'#fff',11,'center'));
    if(btn(VW/2-80,250,160,26,'Keep exploring',true,'#7dff8a'))G.state='play';}
}
let lastT=0;
function frame(now){
  const dt=Math.min(.034,Math.max(0,(now-lastT)/1000)||0);lastT=now;gt+=dt;
  try{update(dt);draw();}catch(err){console.error(err);if(window.__TEST__)throw err;}
  for(const k in pressed)delete pressed[k];mouse.click=false;mouse.rclick=false;mouse.wheel=0;
  Music.update();requestAnimationFrame(frame);
}
resize();buildArt();toTitle();
requestAnimationFrame(frame);
</script>
