@keyframes pop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
.modal h2{font-size:22px;letter-spacing:.08em;margin-bottom:8px}
.modal .desc{color:#cfdcd5;line-height:1.45;margin-bottom:12px}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.btns .yc{background:#5a4a05;border-color:#f5c518}

@keyframes raise{from{transform:translateY(60%) rotate(-10deg);opacity:0}}

<body>

<div id="creator" class="screen">

    <div class="opts">

      <div id="opts"></div>
    </div>
  </div>
  <div class="cr-foot"><button id="randBtn" class="ghost">🎲 Randomize</button><button id="startBtn" class="primary">START MATCH ▶</button></div>
</div>

  <div id="controls"><button id="camBtn" class="hidden">🎥<small id="camLbl">3RD</small></button><button id="varBtn">📺<small>VAR</small></button><button id="whistleBtn">WHISTLE<small>SPACE</small></button></div>

      <button data-v="rew">⏪ Rewind</button><button data-v="slow">▶ Slow-mo</button><button data-v="pause">⏸ Pause</button>
      <button data-v="restore" class="rw">⏮ Rewind match to here</button><button data-v="done" class="ok">✔ Done</button>
    </div>

  <div id="cardOv" class="hidden"><canvas id="cardCv" width="600" height="760"></canvas><div id="cardTxt"></div></div>
  <div id="banner" class="hidden"></div>

  <div class="phonebox">

    <div class="me"><canvas id="mFace" width="400" height="500"></canvas><div class="mecol"><h2 id="mName">REF</h2><div id="mBars"></div></div></div>
    <div id="mMood" class="mood"></div>
    <div class="apps">
      <button data-app="match"><i style="background:linear-gradient(135deg,#22c55e,#15803d)">⚽</i><span>Referee Match</span></button>
      <button data-app="msgs"><i style="background:linear-gradient(135deg,#4ade80,#16a34a)">💬</i><span>Messages</span><b class="badge hidden" id="msgBadge">0</b></button>
      <button data-app="yt"><i style="background:#fff;color:#ff0033">▶</i><span>YouTube</span><b class="badge hidden" id="ytBadge">NEW</b></button>
      <button data-app="home"><i style="background:linear-gradient(135deg,#fbbf24,#d97706)">🏠</i><span>Home</span></button>
      <button data-app="cafe"><i style="background:linear-gradient(135deg,#a16207,#713f12)">☕</i><span>Café</span></button>
      <button data-app="eats"><i style="background:linear-gradient(135deg,#f87171,#dc2626)">🛵</i><span>Food Delivery</span><b class="badge hidden" id="eatsBadge">📦</b></button>
      <button data-app="edit"><i style="background:linear-gradient(135deg,#a78bfa,#6d28d9)">✏️</i><span>Edit Referee</span></button>

</div>

  <div id="appBody"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hx2(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function shade(h,p){let[r,g,b]=hx2(h);const t=p<0?0:255,f=Math.abs(p);return toHex((t-r)*f+r,(t-g)*f+g,(t-b)*f+b)}
function mix(a,b,t){const A=hx2(a),B=hx2(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function rgba(h,a){const[r,g,b]=hx2(h);return`rgba(${r},${g},${b},${a})`}
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ================= CHARACTER ================= */
const OPT={
  skin:['#f7d7c0','#ebbd9b','#d6a07a','#b07850','#875533','#5a3620'],
  hairStyle:['Short','Buzz','Curly','Long','Spiky','Bald'],
  hairColor:['#1b1410','#3b2416','#6b4423','#a8743a','#d9b26b','#8f8f8f'],
  eye:['#4a2f1b','#2e6db0','#3f7a3a','#6e7a80'],
  facial:['None','Stubble','Beard','Mustache','Goatee'],
  kit:['#161616','#f2d21b','#d93030','#1fa055','#e75aa6','#2b6cd6']
};
const ROWS=[['Skin tone','skin','c'],['Hair style','hairStyle','t'],['Hair colour','hairColor','c'],['Eye colour','eye','c'],['Facial hair','facial','t'],['Kit colour','kit','c']];
let CH={name:'Ref Collina',skin:1,hairStyle:0,hairColor:0,eye:0,facial:1,kit:0};

function buildOpts(){
  const o=$('#opts');o.innerHTML='';
  for(const[label,key,type]of ROWS){
    const r=document.createElement('div');r.className='orow';r.innerHTML=`<label>${label}</label><div class="choices"></div>`;
    const c=r.querySelector('.choices');
    OPT[key].forEach((v,i)=>{const b=document.createElement('button');b.className=type==='c'?'sw':'chip';
      if(type==='c')b.style.background=`radial-gradient(circle at 35% 30%,${shade(v,.25)},${v} 60%,${shade(v,-.35)})`;else b.textContent=v;
      if(CH[key]===i)b.classList.add('on');b.onclick=()=>{CH[key]=i;buildOpts();drawPortrait()};c.append(b)});
    o.append(r);
  }
}

function headPath(){const p=new Path2D();p.moveTo(200,85);p.bezierCurveTo(262,85,290,132,288,195);p.bezierCurveTo(286,252,252,302,200,306);p.bezierCurveTo(148,302,114,252,112,195);p.bezierCurveTo(110,132,138,85,200,85);p.closePath();return p}
function hairTopPath(){const p=new Path2D();p.moveTo(110,205);p.bezierCurveTo(98,120,140,64,200,62);p.bezierCurveTo(260,64,302,120,290,205);p.lineTo(282,206);p.bezierCurveTo(280,160,262,126,200,124);p.bezierCurveTo(138,126,120,160,118,206);p.closePath();return p}
function hairLongPath(){const p=new Path2D();p.moveTo(104,345);p.bezierCurveTo(90,250,94,140,140,90);p.bezierCurveTo(170,60,230,60,260,90);p.bezierCurveTo(306,140,310,250,296,345);p.lineTo(274,345);p.bezierCurveTo(284,262,282,172,258,140);p.bezierCurveTo(236,120,164,120,142,140);p.bezierCurveTo(118,172,116,262,126,345);p.closePath();return p}

function drawCardHand(ctx,x,y,s,skin,kit,card,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  // sleeve
  let g=ctx.createLinearGradient(-38,0,38,0);g.addColorStop(0,shade(kit,-.45));g.addColorStop(.5,shade(kit,.12));g.addColorStop(1,shade(kit,-.45));
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-40,160);ctx.lineTo(-30,58);ctx.lineTo(30,58);ctx.lineTo(40,160);ctx.closePath();ctx.fill();
  ctx.fillStyle=shade(kit,-.55);ctx.fillRect(-31,54,62,8);
  // wrist
  g=ctx.createLinearGradient(-22,0,22,0);g.addColorStop(0,shade(skin,-.3));g.addColorStop(.5,skin);g.addColorStop(1,shade(skin,-.3));
  ctx.fillStyle=g;rr(ctx,-22,22,44,38,10);ctx.fill();
  // card
  ctx.save();ctx.rotate(-.08);ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;
  g=ctx.createLinearGradient(-36,-112,36,0);g.addColorStop(0,shade(card,.25));g.addColorStop(.6,card);g.addColorStop(1,shade(card,-.2));
  ctx.fillStyle=g;rr(ctx,-36,-114,72,108,6);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.save();ctx.rotate(-.08);rr(ctx,-32,-110,20,100,4);ctx.fill();ctx.restore();
  // palm
  g=ctx.createRadialGradient(-6,8,4,0,18,36);g.addColorStop(0,shade(skin,.1));g.addColorStop(1,shade(skin,-.28));
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,18,31,27,0,0,7);ctx.fill();
  // fingers
  for(let i=0;i<4;i++){const fx=-24+i*16,top=-22+(i===0?6:i===3?8:i===2?1:0);
    g=ctx.createLinearGradient(fx-7,0,fx+7,0);g.addColorStop(0,shade(skin,-.32));g.addColorStop(.45,shade(skin,.08));g.addColorStop(1,shade(skin,-.3));
    ctx.fillStyle=g;rr(ctx,fx-7.5,top,15,36,7.5);ctx.fill();
    ctx.strokeStyle=rgba(shade(skin,-.55),.45);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(fx-4,top+11);ctx.quadraticCurveTo(fx,top+13,fx+4,top+11);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx-4,top+23);ctx.quadraticCurveTo(fx,top+25,fx+4,top+23);ctx.stroke();}
  // thumb
  ctx.save();ctx.translate(-30,12);ctx.rotate(-.85);
  g=ctx.createLinearGradient(-8,0,8,0);g.addColorStop(0,shade(skin,-.3));g.addColorStop(.5,shade(skin,.1));g.addColorStop(1,shade(skin,-.35));
  ctx.fillStyle=g;rr(ctx,-8,-44,16,48,8);ctx.fill();
  ctx.fillStyle=rgba(mix(skin,'#ffd6d6',.5),.85);rr(ctx,-5,-42,10,12,5);ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawPortrait(){drawFace($('#portrait'),chLook(),true);$('#nameplate').textContent=(CH.name||'REF').toUpperCase()}
function drawFace(cv,LK,isRef){
  const ctx=cv.getContext('2d');ctx.setTransform(cv.width/400,0,0,cv.height/500,0,0);
  const ch={hairStyle:LK.hs,facial:LK.fh},skin=LK.skin,hair=LK.hair,kit=LK.kit,eye=LK.eye;
  const R=mulberry(1234+ch.hairStyle*31+ch.facial*7);
  const head=headPath();
  // background
  let g=ctx.createRadialGradient(200,170,20,200,250,400);g.addColorStop(0,'#2f5240');g.addColorStop(1,'#050b08');ctx.fillStyle=g;ctx.fillRect(0,0,400,500);
  for(let i=0;i<16;i++){const x=R()*400,y=R()*210,r=8+R()*28,gg=ctx.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,'rgba(255,248,215,.32)');gg.addColorStop(1,'rgba(255,248,215,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  // long hair back
  if(ch.hairStyle===3){g=ctx.createLinearGradient(0,80,0,430);g.addColorStop(0,shade(hair,.12));g.addColorStop(1,shade(hair,-.4));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(110,170);ctx.bezierCurveTo(82,280,90,390,118,430);ctx.lineTo(282,430);ctx.bezierCurveTo(310,390,318,280,290,170);ctx.closePath();ctx.fill()}
  // neck
  g=ctx.createLinearGradient(0,250,0,380);g.addColorStop(0,shade(skin,-.45));g.addColorStop(.35,shade(skin,-.18));g.addColorStop(1,skin);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(158,250);ctx.lineTo(242,250);ctx.bezierCurveTo(240,300,246,340,262,374);ctx.lineTo(138,374);ctx.bezierCurveTo(154,340,160,300,158,250);ctx.fill();
  // adam's apple / tendons
  ctx.strokeStyle=rgba(shade(skin,-.4),.35);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(172,300);ctx.quadraticCurveTo(178,340,190,372);ctx.moveTo(228,300);ctx.quadraticCurveTo(222,340,210,372);ctx.stroke();
  // torso
  g=ctx.createLinearGradient(10,0,390,0);g.addColorStop(0,shade(kit,-.5));g.addColorStop(.5,shade(kit,.14));g.addColorStop(1,shade(kit,-.5));
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(6,500);ctx.bezierCurveTo(18,420,55,372,150,352);ctx.lineTo(200,412);ctx.lineTo(250,352);ctx.bezierCurveTo(345,372,382,420,394,500);ctx.closePath();ctx.fill();
  // fabric folds
  ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=3;
  [[90,420,120,470,110,500],[300,415,280,460,295,500],[170,440,180,470,165,500],[235,445,225,470,240,500]].forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(a[2],a[3],a[4],a[5]);ctx.stroke()});
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(60,400);ctx.quadraticCurveTo(100,370,148,358);ctx.moveTo(340,400);ctx.quadraticCurveTo(300,370,252,358);ctx.stroke();
  // collar trim
  const trim=lum(kit)<.35?'#e9e9e9':'#121212';ctx.strokeStyle=trim;ctx.lineWidth=7;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(146,350);ctx.lineTo(200,414);ctx.lineTo(254,350);ctx.stroke();
  if(isRef){
  // badge
  ctx.fillStyle=shade(kit,-.35);rr(ctx,250,420,58,30,5);ctx.fill();ctx.strokeStyle='#d8b23a';ctx.lineWidth=1.5;rr(ctx,250,420,58,30,5);ctx.stroke();
  ctx.fillStyle='#e8c34a';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('REFEREE',279,440);
  // lanyard + whistle
  ctx.strokeStyle='#0c0c0c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(172,356);ctx.quadraticCurveTo(180,420,196,452);ctx.moveTo(228,356);ctx.quadraticCurveTo(222,420,204,452);ctx.stroke();
  ctx.save();ctx.translate(200,462);ctx.rotate(.25);g=ctx.createLinearGradient(0,-10,0,10);g.addColorStop(0,'#f6f6f6');g.addColorStop(.5,'#9aa1a6');g.addColorStop(1,'#4e5458');ctx.fillStyle=g;rr(ctx,-20,-9,30,18,8);ctx.fill();ctx.beginPath();ctx.arc(10,0,11,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-6,-9,6,4);ctx.restore();
  }
  // ears
  [[110,212,1],[290,212,-1]].forEach(([x,y,d])=>{g=ctx.createRadialGradient(x,y,2,x,y,26);g.addColorStop(0,shade(skin,-.15));g.addColorStop(1,shade(skin,-.35));ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,14,26,d*.12,0,7);ctx.fill();
    ctx.strokeStyle=rgba(shade(skin,-.55),.5);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x+d*2,y,7,16,d*.12,-1.6,1.4*d>0?1.4:4.7);ctx.stroke()});
  // head
  g=ctx.createRadialGradient(180,165,10,200,200,150);g.addColorStop(0,shade(skin,.12));g.addColorStop(.55,skin);g.addColorStop(1,shade(skin,-.35));
  ctx.fillStyle=g;ctx.fill(head);
  ctx.save();ctx.clip(head);

let AC=null,crowdGain=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
  const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=480;f.Q.value=.5;crowdGain=AC.createGain();crowdGain.gain.value=.1;src.connect(f).connect(crowdGain).connect(AC.destination);src.start()}catch(e){AC=null}}
function whistle(n=1,len=.45){if(!AC)return;for(let k=0;k<n;k++){const t0=AC.currentTime+k*(len+.12);const o=AC.createOscillator();o.frequency.value=2900;const lfo=AC.createOscillator();lfo.frequency.value=28;const lg=AC.createGain();lg.gain.value=200;lfo.connect(lg).connect(o.frequency);const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.16,t0+.02);g.gain.setValueAtTime(.16,t0+len-.05);g.gain.linearRampToValueAtTime(0,t0+len);o.connect(g).connect(AC.destination);o.start(t0);lfo.start(t0);o.stop(t0+len);lfo.stop(t0+len)}}
function sfx(type){if(!AC)return;const t=AC.currentTime;
  if(type==='kick'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.16)}
  else{const len=AC.sampleRate*.25,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,type==='thud'?6:2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type==='thud'?'lowpass':'bandpass';f.frequency.value=type==='thud'?300:1800;const g=AC.createGain();g.gain.value=type==='thud'?.9:.25;s.connect(f).connect(g).connect(AC.destination);s.start(t)}}

function kickoff(team){

  for(const p of G.players){if(p.off)continue;if(p.state!=='leaving')p.state='run';p.vx=p.vy=0;p.st=0;
    let x=p.team?p.hx*.9+PW*.1:p.hx*.9;x=p.team?Math.max(x,548):Math.min(x,502);if(p.state!=='leaving'){p.x=x;p.y=p.hy}p.dir=p.team?Math.PI:0}
  Object.assign(b,{x:525,y:340,vx:0,vy:0,z:0,vz:0,owner:-1,reserved:team,resUntil:G.t+2});

  if(k){k.x=team?536:514;k.y=340;b.owner=k.id;b.last=team;k.dec=.7}

function inBox(x,y,def){return y>BOXY1&&y<BOXY2&&(def===0?x<BOXD:x>PW-BOXD)}
function homeTarget(p){
  const b=G.ball;
  if(p.role===0){const gx=p.team?PW-22:22;let ty=clamp(340+(b.y-340)*.3,312,368);
    const toward=p.team?b.vx>150:b.vx<-150;if(b.owner<0&&toward&&Math.abs(b.vx)>1){const tt=(gx-b.x)/b.vx;if(tt>0&&tt<1.5)ty=clamp(b.y+b.vy*tt,300,380)}

function moveTo(p,tx,ty,sp,dt){
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);let ux=0,uy=0;
  if(d>3){const k=sp*Math.min(1,d/30)/d;ux=dx*k;uy=dy*k}
  p.vx+=(ux-p.vx)*Math.min(1,dt*6);p.vy+=(uy-p.vy)*Math.min(1,dt*6);

function update(dt){

  moveRef(dt);
  const b=G.ball,P=G.players;
  const active=P.filter(p=>!p.off&&p.state==='run');
  const chasers=new Set();
  for(let t=0;t<2;t++){
    if(b.owner>=0&&P[b.owner].team===t)continue;
    const cand=active.filter(p=>p.team===t&&p.role>0).sort((a,c)=>dist(a,b)-dist(c,b));
    if(cand[0])chasers.add(cand[0].id);if(cand[1]&&b.owner>=0&&dist(cand[1],b)<220)chasers.add(cand[1].id);
  }
  for(const p of P)updatePlayer(p,dt,chasers);

  for(const f of G.fouls)if(!f.done&&G.t-f.t>=10){f.done=true;if(f.sev==='Violent')repChange(-8,'Fans furious — you missed a violent foul!');else if(f.box)repChange(-6,'You missed a penalty shout!')}

}

function computeView(){
  const dpr=Math.min(2,devicePixelRatio||1),cw=cv.clientWidth,ch=cv.clientHeight;
  if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr)}
  const portrait=ch>cw*1.15,top=cw<600?92:60,bot=104,aw=cw-12,ah=ch-top-bot;
  const sc=portrait?Math.min(aw/(PH+40),ah/(PW+40)):Math.min(aw/(PW+50),ah/(PH+50));
  const m=new DOMMatrix().translate(cw/2,top+ah/2).rotate(portrait?90:0).scale(sc).translate(-PW/2,-PH/2);
  VIEW={m,inv:m.inverse(),sc,portrait,dpr,cw,ch};
}

function drawPerson(o){

    ctx.fillStyle=shorts;ctx.beginPath();ctx.ellipse(sw,-3.5,4.2,2.5,0,0,7);ctx.ellipse(-sw,3.5,4.2,2.5,0,0,7);ctx.fill();

    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(-3,-8,2.2,0,7);ctx.arc(-4,8,2.2,0,7);ctx.fill();

    if(p.state==='leaving'){ctx.fillStyle='#e23b3b';ctx.fillRect(s.x+fs,ly-fs*.5,fs*.6,fs*.9)}

function drawMini(c,x,y,s,L,o={}){
  c.save();c.translate(x,y);c.scale(s*(o.flip?-1:1),s);
  const sk=L.skin,kit=L.kit,hair=L.hair,pants=o.pants||'#2b3140',w=o.walk?Math.sin(o.walk):0;
  c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(0,0,36,9,0,0,7);c.fill();
  if(o.seated)c.translate(0,44);
  else for(const sx of[-1,1]){const sw=w*sx*8;c.fillStyle=pants;rr(c,sx*11-8+sw*.4,-86,16,80,7);c.fill();c.fillStyle='#1b1b1b';c.beginPath();c.ellipse(sx*11+sw*.4+2,-5,12,6,0,0,7);c.fill()}
  let g=c.createLinearGradient(-30,0,30,0);g.addColorStop(0,shade(kit,-.35));g.addColorStop(.5,shade(kit,.14));g.addColorStop(1,shade(kit,-.35));
  for(const sx of[-1,1]){const sw=-w*sx*.25;c.save();c.translate(sx*26,-146);const shk=Math.sin(performance.now()/85)*.13;c.rotate(sx*.13+sw+(o.wave&&sx===1?-2.4+Math.sin(performance.now()/150)*.3:0)+(o.eat&&sx===1?-1.6:0)+(o.raise&&sx===1?-2.6:0)+(o.shake==='R'&&sx===1?-1.25+shk:0)+(o.shake==='L'&&sx===-1?1.25+shk:0));
    c.fillStyle=shade(kit,-.12);rr(c,-7.5,0,15,27,6);c.fill();if(o.capt&&sx===-1){c.fillStyle='#facc15';c.fillRect(-7.5,13,15,8);c.fillStyle='#111';c.font='bold 7px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('C',0,17.5)}c.fillStyle=shade(sk,-.05);rr(c,-5.5,22,11,38,5);c.fill();c.beginPath();c.arc(0,62,6.5,0,7);c.fill();
    if(o.eat&&sx===1){c.fillStyle='#e8b04a';rr(c,-9,62,18,10,4);c.fill()}c.restore()}
  c.fillStyle=g;c.beginPath();c.moveTo(-29,-150);c.quadraticCurveTo(0,-158,29,-150);c.lineTo(23,-82);c.lineTo(-23,-82);c.closePath();c.fill();
  c.fillStyle='rgba(0,0,0,.15)';c.beginPath();c.moveTo(-8,-154);c.lineTo(0,-140);c.lineTo(8,-154);c.fill();
  if(o.apron){c.fillStyle='#f1ede4';rr(c,-18,-128,36,48,5);c.fill();c.strokeStyle='#cfc8b8';c.lineWidth=2;c.beginPath();c.moveTo(-14,-128);c.lineTo(-10,-150);c.moveTo(14,-128);c.lineTo(10,-150);c.stroke()}
  if(o.ref){c.fillStyle='#e8c34a';c.fillRect(8,-138,12,6)}
  c.fillStyle=shade(pants,-.2);c.fillRect(-23,-88,46,8);
  c.fillStyle=shade(sk,-.18);c.fillRect(-7,-168,14,18);
  const hy=-188;
  if(L.hs===3){c.fillStyle=shade(hair,-.15);rr(c,-22,hy-12,44,52,14);c.fill()}
  g=c.createRadialGradient(-5,hy-7,3,0,hy,27);g.addColorStop(0,shade(sk,.12));g.addColorStop(1,shade(sk,-.22));c.fillStyle=g;c.beginPath();c.ellipse(0,hy,19,23,0,0,7);c.fill();
  c.fillStyle=shade(sk,-.18);c.beginPath();c.ellipse(-19,hy+2,4,6,0,0,7);c.ellipse(19,hy+2,4,6,0,0,7);c.fill();
  if(o.closed){c.strokeStyle='#222';c.lineWidth=1.6;for(const sx of[-1,1]){c.beginPath();c.arc(sx*7,hy-3,4,.2,Math.PI-.2);c.stroke()}}
  else for(const sx of[-1,1]){c.fillStyle='#fff';c.beginPath();c.ellipse(sx*7,hy-2,4.2,2.8,0,0,7);c.fill();c.fillStyle=L.eye||'#3a2414';c.beginPath();c.arc(sx*7+(o.look||0),hy-2,2.1,0,7);c.fill();c.fillStyle='#000';c.beginPath();c.arc(sx*7+(o.look||0),hy-2,1,0,7);c.fill()}
  c.strokeStyle=lum(hair)>.45?shade(hair,-.35):hair;c.lineWidth=2.3;for(const sx of[-1,1]){c.beginPath();c.moveTo(sx*3,hy-8);c.lineTo(sx*11,hy-9.5);c.stroke()}
  c.strokeStyle=rgba(shade(sk,-.5),.6);c.lineWidth=1.5;c.beginPath();c.moveTo(0,hy-1);c.lineTo(-2,hy+6);c.lineTo(1.5,hy+7);c.stroke();
  const fh=L.fh;
  if(fh===1){c.fillStyle=rgba(hair,.32);c.beginPath();c.ellipse(0,hy+9,16,12,0,0,Math.PI);c.fill()}
  if(fh===2){c.fillStyle=hair;c.beginPath();c.moveTo(-18.5,hy);c.quadraticCurveTo(-17,hy+30,0,hy+31);c.quadraticCurveTo(17,hy+30,18.5,hy);c.quadraticCurveTo(10,hy+12,0,hy+13);c.quadraticCurveTo(-10,hy+12,-18.5,hy);c.fill()}
  c.strokeStyle=mix(sk,'#8a3040',.55);c.lineWidth=2.2;c.beginPath();if(o.talk&&Math.sin(performance.now()/90)>0){c.fillStyle='#5a1f25';c.ellipse(0,hy+11,4,3,0,0,7);c.fill()}else{c.arc(0,hy+8,5,.25,Math.PI-.25)}c.stroke();
  if(fh===3||fh===4){c.fillStyle=hair;c.beginPath();c.ellipse(0,hy+6,8.5,2.6,0,0,7);c.fill()}
  if(fh===4){c.fillStyle=hair;c.beginPath();c.ellipse(0,hy+19,6,5,0,0,7);c.fill()}
  c.fillStyle=hair;const hs=L.hs;
  if(hs===0||hs===1||hs===3||hs===4){c.globalAlpha=hs===1?.7:1;c.beginPath();c.ellipse(0,hy-8,20.5,17,0,Math.PI,0);c.lineTo(20,hy-4);c.quadraticCurveTo(10,hy-17,-20,hy-4);c.closePath();c.fill();c.globalAlpha=1}
  if(hs===4)for(let i=0;i<6;i++){const xx=-16+i*6.5;c.beginPath();c.moveTo(xx-5,hy-18);c.lineTo(xx+1,hy-34+Math.abs(i-2.5)*2);c.lineTo(xx+5,hy-18);c.fill()}
  if(hs===2)for(let i=0;i<15;i++){const a=Math.PI*1.02+i/14*Math.PI*.96;c.beginPath();c.arc(Math.cos(a)*18,hy-5+Math.sin(a)*19,6.5,0,7);c.fill()}
  if(hs===5){c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.ellipse(-5,hy-15,7,4,-.3,0,7);c.fill()}
  c.restore()}

const JOY={x:0,y:0};
function setupJoy(){const j=$('#joy'),k=j.querySelector('b');let id=null,cx=0,cy=0;const R=48;
  const set=(x,y)=>{let dx=x-cx,dy=y-cy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l}JOY.x=dx/R;JOY.y=dy/R;k.style.transform=`translate(${dx}px,${dy}px)`};
  j.addEventListener('pointerdown',e=>{e.stopPropagation();id=e.pointerId;const r=j.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;try{j.setPointerCapture(id)}catch(_){}set(e.clientX,e.clientY)});
  j.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e.clientX,e.clientY)});
  const end=e=>{if(e.pointerId!==id)return;id=null;JOY.x=JOY.y=0;k.style.transform=''};j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end)}
