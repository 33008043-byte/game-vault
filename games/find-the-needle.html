<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Find the Needle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: deadpan farm-sim; one absurd job done seriously
   IDEA: a sun-lit polytunnel hay barn with a mountain of hay and a sell stand
   PICTURE: the full-bleed first-person 3D barn itself
   COLOUR and TYPE: hay gold, barn wood, sky blue; dark green-black HUD panels with gold edges; Archivo Black + Barlow Condensed
   LAYOUT: full-screen game, stats top-left, crosshair centre, hand meter + hotbar + key legend bottom centre */
:root{color-scheme:dark;--panel:rgba(14,22,16,.82);--gold:#e3b04b;--gold2:#f5d27a;--ink:#f3ead6;--soft:#b9ad92;--green:#8fd46a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:600 16px/1.35 "Barlow Condensed",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#hud.off{display:none}
.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.cross.hot{border-color:var(--gold2);transform:scale(1.35)}
.cross.needle{border-color:var(--green);transform:scale(1.6)}
.stats{position:absolute;left:16px;top:14px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.stats div{background:var(--panel);border:1px solid rgba(227,176,75,.35);border-radius:8px;padding:5px 12px;min-width:86px}
.stats span{display:block;font-size:13px;color:var(--soft);letter-spacing:.3px}
.stats b{font:800 22px/1.05 "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:18px;font-weight:700;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap;text-align:center}
.bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(96vw,820px)}
.handbar{position:relative;width:260px;height:20px;background:var(--panel);border:1px solid rgba(227,176,75,.5);border-radius:6px;overflow:hidden}
#handFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#b98a3a,#f0cf73)}
.handbar span{position:relative;display:block;text-align:center;font-size:14px;font-weight:800;line-height:18px;text-shadow:0 1px 2px #000}
.handbar.full{border-color:#ff7b5c}
.hotbar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:64px;height:66px;background:var(--panel);border:2px solid rgba(255,255,255,.12);border-radius:6px;display:grid;place-items:center}
.slot.sel{border-color:var(--gold)}
.slot i{position:absolute;top:2px;left:0;right:0;text-align:center;font-style:normal;font-size:13px;font-weight:800;color:var(--gold2)}
.slot em{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-style:normal;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.slot svg{margin-top:-4px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:15px;text-shadow:0 1px 2px #000}
kbd{display:inline-block;min-width:22px;padding:0 5px;margin-right:4px;border:1px solid rgba(255,255,255,.55);border-radius:4px;background:rgba(0,0,0,.45);font:800 13px/18px "Barlow Condensed",sans-serif;text-align:center}
.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:8px 16px;font-size:17px;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.gfx{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.gfx span{font-size:15px;color:var(--gold2);letter-spacing:.6px;margin-right:4px}
.gfx button{font:800 16px "Barlow Condensed",sans-serif;min-height:40px;min-width:70px;border-radius:6px;border:1px solid rgba(227,176,75,.5);background:transparent;color:var(--ink);cursor:pointer}
.gfx button.on{background:var(--gold);color:#2b1c08}
.gfx button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ov{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.7))}
#ov.off{display:none}
.card{width:min(560px,100%);text-align:center}
.title{font:400 clamp(44px,9vw,92px)/.92 "Archivo Black",sans-serif;color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.35);margin:0 0 6px;letter-spacing:1px}
.title small{display:block;font-size:.5em}
.sub{font-size:20px;margin:0 0 18px;text-shadow:0 1px 3px #000}
.panel{background:var(--panel);border:1px solid rgba(227,176,75,.45);border-radius:10px;padding:16px 18px;margin-top:14px;text-align:left}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--gold2);letter-spacing:.6px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:16px}
@media(max-width:520px){.keys{grid-template-columns:minmax(0,1fr)}}
.go{font:800 22px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;min-height:54px;padding:10px 36px;border-radius:8px;border:2px solid var(--gold2);background:linear-gradient(#f0cf73,#c99a3e);color:#2b1c08;cursor:pointer;box-shadow:0 4px 0 #7a5418}
.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #7a5418}
.go:disabled{opacity:.6;cursor:wait}
.statrow{display:flex;justify-content:space-around;gap:10px;margin:6px 0 4px;flex-wrap:wrap}
.statrow div{text-align:center}.statrow b{display:block;font-size:30px;line-height:1}.statrow span{font-size:14px;color:var(--soft)}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#joy{position:absolute;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:68px;height:68px;border-radius:50%;background:rgba(14,22,16,.7);border:2px solid var(--gold);color:var(--ink);font:800 15px "Barlow Condensed",sans-serif;display:grid;place-items:center}
.tb:active,.tb.down{background:rgba(227,176,75,.55)}
#tGrab{right:24px;bottom:110px;width:84px;height:84px;font-size:18px}
#tThrow{right:120px;bottom:150px}#tDrop{right:118px;bottom:66px}#tJump{right:30px;bottom:22px;width:62px;height:62px}
body.touchmode .legend,body.touchmode .hotbar{display:none}
body.touchmode .bottom{bottom:auto;top:66px;left:auto;right:12px;transform:none;width:auto}
@media(max-width:600px){.stats b{font-size:18px}.stats div{min-width:70px;padding:4px 9px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.pop{animation-duration:.01s}}
.money{position:absolute;right:16px;top:14px;text-align:right;background:var(--panel);border:1px solid rgba(227,176,75,.5);border-radius:8px;padding:6px 14px}
.money b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif;color:#9be36d;font-variant-numeric:tabular-nums}
.money span{font-size:13px;color:var(--soft)}
#pops{position:absolute;right:20px;top:84px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pop{font:800 22px "Barlow Condensed",sans-serif;color:#9be36d;text-shadow:0 1px 3px #000;animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#shop{position:fixed;inset:0;background:rgba(8,10,8,.95);display:flex;flex-direction:column;z-index:5}
#shop.off{display:none}
.shophead{display:flex;align-items:center;gap:10px 18px;padding:12px 20px;border-bottom:1px solid rgba(227,176,75,.3);flex-wrap:wrap}
.shophead h2{font:400 26px "Archivo Black",sans-serif;margin:0;color:#fff;letter-spacing:.5px}
.shophead b{font:800 30px "Barlow Condensed",sans-serif;color:#9be36d;margin-left:auto;font-variant-numeric:tabular-nums}
.shophead button{font:800 17px "Barlow Condensed",sans-serif;min-height:44px;padding:6px 16px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--ink);cursor:pointer}
.shophead button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#sMsg{font-size:17px;color:var(--gold2)}
.tree{position:relative;flex:1;overflow:auto;display:flex;gap:52px;padding:18px 32px 40px;align-items:flex-start}
#treeLines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#treeLines path{fill:none;stroke:rgba(227,176,75,.25);stroke-width:2}
#treeLines path.on{stroke:#e3b04b}
.tcol{display:flex;flex-direction:column;gap:12px;width:282px;flex:none;position:relative;z-index:1}
.tcol h4{margin:0 0 2px;font-size:15px;letter-spacing:1px;color:var(--soft);text-transform:uppercase}
.node{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:96px;padding:10px 12px;background:#14201a;border:2px solid #3c5a43;border-radius:4px;color:var(--ink);cursor:pointer;font:inherit}
.node:hover{border-color:var(--gold2)}
.node:focus-visible{outline:3px solid #fff;outline-offset:2px}
.node .ico{flex:none;width:46px;height:46px;display:grid;place-items:center;background:rgba(255,255,255,.04);border-radius:6px}
.node .nt{display:flex;flex-direction:column;min-width:0;flex:1}
.node .cat{font-size:12px;font-weight:800;color:#e0873a;letter-spacing:.8px}
.node b{font-size:20px;line-height:1.1}
.node small{font-size:13px;color:var(--soft);line-height:1.25;margin-top:2px}
.node .ft{display:flex;justify-content:space-between;margin-top:6px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.node.buy .pr{color:#9be36d}.node.poor .pr{color:#ff7b6b}
.node.done{background:#2a2112;border-color:#8a6a2a}.node.done .pr,.node.done .lv{color:#e3b04b}
.node.locked{background:#0f1311;border-color:#25302a;opacity:.6;cursor:not-allowed}.node.locked .pr{color:#8a8f8a}
#tShop{left:18px;bottom:170px;width:62px;height:62px}#tTool{left:92px;bottom:170px;width:62px;height:62px}
body.touchmode .money{top:auto;bottom:240px;right:12px}
@media(max-width:600px){.money b{font-size:22px}.tree{padding:14px;gap:36px}}

</style>
</head>
<body>
<canvas id="c" aria-label="First-person hay barn. Grab hay to dig for the hidden needle."></canvas>

<div id="hud" class="off">
  <div class="cross" id="cross"></div>
  <div class="stats">
    <div><span>Time</span><b id="hTime">0:00</b></div>
    <div><span>Hay moved</span><b id="hMoved">0</b></div>
    <div><span>Strands in the stack</span><b id="hLeft">0</b></div>
    <div><span>Loose on the floor</span><b id="hLoose">0</b></div>
    <div><span>Sent to HAY IN</span><b id="hIn">0</b></div>
  </div>
  <div class="prompt" id="prompt"></div>
  <div class="bottom">
    <div class="handbar" id="handbar"><div id="handFill"></div><span id="handTxt">Hand 0 / 80</span></div>
    <div class="hotbar" id="hotbar"></div>
    <div class="legend"><span><kbd>LMB</kbd>Grab</span><span><kbd>RMB</kbd>Throw</span><span><kbd>Q</kbd>Drop</span><span><kbd>WASD</kbd>Move</span><span><kbd>Space</kbd>Jump</span><span><kbd>Shift</kbd>Run</span><span><kbd>1-9</kbd>Tools</span><span><kbd>B</kbd>Shop</span></div>
  </div>
  <div class="money"><b id="hMoney">$0.00</b><span id="hPrice">$0.0222 per strand</span></div>
  <div id="pops"></div>
  <div class="toast" id="toast"></div>
</div>

<div id="shop" class="off" role="dialog" aria-label="Build catalogue">
  <div class="shophead"><h2>BUILD CATALOGUE</h2><span id="sMsg"></span><b id="sMoney">$0.00</b><button id="sClose">Back to work (B)</button></div>
  <div class="tree" id="tree"></div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="tGrab">GRAB</button>
  <button class="tb" id="tThrow">THROW</button>
  <button class="tb" id="tDrop">DROP</button>
  <button class="tb" id="tJump">JUMP</button>
  <button class="tb" id="tShop">SHOP</button>
  <button class="tb" id="tTool">TOOL</button>
</div>

<div id="ov"><div class="card" id="ovCard">
  <h1 class="title">FIND THE<small>NEEDLE</small></h1>
  <p class="sub">Building the haystack…</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
if(!window.THREE){$('#ovCard').innerHTML='<h1 class="title">FIND THE<small>NEEDLE</small></h1><p class="sub">The 3D engine did not load. Reload the page to try again.</p>';throw new Error('three missing')}

/* ================= CONFIG ================= */
const VS=.12;                 // voxel size (m)
const SPV=2;                  // hay strands per voxel
const CH=16;                  // chunk size (voxels)
let K=3;                      // surface straws drawn per exposed voxel (set by graphics quality)
var POST=null;
const MOUND={cx:0,cz:-5,R:8,H:6};
const HALL={x:12,z:20,wall:6};
const REACH=3.1,GRAB_R=.17,GRAB_MS=240;
const PR=.3,PH=1.7,EYE=1.62,GRAV=20,JUMP=6.6,WALK=4.4,RUN=7.4;
const NEEDLE_HALF=.16,FIND_RULE=.8;

/* ================= RENDERER ================= */
const cv=$('#c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(1.75,window.devicePixelRatio||1));
renderer.autoClear=false;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(new THREE.Color(0xd9d2c2).convertSRGBToLinear(),30,120);
const cam=new THREE.PerspectiveCamera(72,1,.03,400);cam.rotation.order='YXZ';
const vScene=new THREE.Scene(),vCam=new THREE.PerspectiveCamera(55,1,.01,10);
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);cam.aspect=vCam.aspect=w/h;cam.updateProjectionMatrix();vCam.updateProjectionMatrix();if(typeof postResize==='function')postResize()}
window.addEventListener('resize',resize);resize();

/* ================= TEXTURES ================= */
function canvasTex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=renderer.capabilities.getMaxAnisotropy?Math.min(16,renderer.capabilities.getMaxAnisotropy()):4;t.encoding=THREE.sRGBEncoding;return t}
// normal maps generated from the colour textures (surface relief for wood, sand, hay, metal)
const NRM=new Map();
function makeNormal(tex,strength){const src=tex.image,w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),o=x.createImageData(w,h),od=o.data;
  const lum=new Float32Array(w*h);for(let i=0;i<w*h;i++)lum[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/765;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const L_=(a,b)=>lum[((b+h)%h)*w+((a+w)%w)];const dx=(L_(i+1,j)-L_(i-1,j))*strength,dy=(L_(i,j+1)-L_(i,j-1))*strength,l=Math.hypot(dx,dy,1),k=(j*w+i)*4;od[k]=(-dx/l*.5+.5)*255;od[k+1]=(dy/l*.5+.5)*255;od[k+2]=(1/l*.5+.5)*255;od[k+3]=255}
  x.putImageData(o,0,0);NRM.set(src,c)}
function rep(t,rx,ry){const c=t.clone();c.needsUpdate=true;c.repeat.set(rx,ry);return c}
const R_=Math.random;
const skyTex=canvasTex(1024,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2f7fd6');g.addColorStop(.42,'#6fb0ec');g.addColorStop(.5,'#d8ebf8');g.addColorStop(1,'#cfd9de');x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let c=0;c<26;c++){const cx=R_()*w,cy=40+R_()*170,s=30+R_()*60;for(let k=0;k<14;k++){const gx=cx+(R_()-.5)*s*3,gy=cy+(R_()-.5)*s*.7,r=s*(.4+R_()*.6);const rg=x.createRadialGradient(gx,gy,0,gx,gy,r);rg.addColorStop(0,'rgba(255,255,255,.85)');rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.beginPath();x.arc(gx,gy,r,0,7);x.fill()}}});
skyTex.wrapT=THREE.ClampToEdgeWrapping;
const sandTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#d4b98c';x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const v=R_();x.fillStyle=v<.5?`rgba(120,90,50,${R_()*.18})`:`rgba(255,240,210,${R_()*.2})`;x.fillRect(R_()*w,R_()*h,1+R_()*2,1+R_()*2)}for(let i=0;i<40;i++){const rg=x.createRadialGradient(0,0,0,0,0,60);const px=R_()*w,py=R_()*h;x.save();x.translate(px,py);rg.addColorStop(0,'rgba(150,115,70,.12)');rg.addColorStop(1,'rgba(150,115,70,0)');x.fillStyle=rg;x.fillRect(-60,-60,120,120);x.restore()}x.lineCap='round';for(let i=0;i<120;i++){x.strokeStyle=`hsla(${38+R_()*10},70%,${50+R_()*20}%,.55)`;x.lineWidth=1.5;const a=R_()*6.28,X=R_()*w,Y=R_()*h,l=6+R_()*14;x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);x.stroke()}},10,16);
const plankTex=canvasTex(512,512,(x,w,h)=>{const cols=['#6e4a2c','#7a5433','#644226','#83603c','#5d3f25'];for(let i=0;i<8;i++){x.fillStyle=cols[i%5];x.fillRect(i*64,0,64,h);for(let k=0;k<40;k++){x.fillStyle=`rgba(0,0,0,${R_()*.12})`;x.fillRect(i*64+4+R_()*56,R_()*h,1,30+R_()*120)}x.fillStyle='rgba(0,0,0,.45)';x.fillRect(i*64,0,3,h);x.fillStyle='rgba(255,230,190,.06)';x.fillRect(i*64+3,0,2,h);for(const ny of[60+R_()*40,380+R_()*60]){x.fillStyle='#3a2a1a';x.beginPath();x.arc(i*64+12,ny,2.4,0,7);x.arc(i*64+52,ny,2.4,0,7);x.fill()}}});
const roofTex=canvasTex(512,512,(x,w,h)=>{for(let i=0;i<10;i++){x.fillStyle=['#4b3624','#55402b','#46321f'][i%3];x.fillRect(0,i*51.2,w,51.2);x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,i*51.2,w,3)}for(let k=0;k<300;k++){x.fillStyle=`rgba(0,0,0,${R_()*.1})`;x.fillRect(R_()*w,R_()*h,40+R_()*100,1)}});

  let budget=12;for(const c of W.chunks){if(c.dirty&&budget-->0)rebuild(c)}
  pv.multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse);frustum.setFromProjectionMatrix(pv);
  for(const c of W.chunks){if(!c.box)continue;const v=c.n>0&&frustum.intersectsSphere(c.sphere);c.box.visible=c.straw.visible=v}
  updateFly(dt);
  beltTex.offset.x-=dt*BELT_SPEED/BELT.seg;
  // magnet x-ray
  const mag=G.state==='play'&&S.tool==='magnet'&&Math.hypot(cam.position.x-N_.x,cam.position.y-N_.y,cam.position.z-N_.z)<stats('magnet').range;
  setXray(mag);
  if(mag){needleM.emissive.setHSL(.33,.9,.25+.2*Math.sin(now/110));needle.position.set(N_.x+(R_()-.5)*.006,N_.y+(R_()-.5)*.006,N_.z+(R_()-.5)*.006)}
  // needle glint every 3s when exposed and in sight
  visT-=dt;if(visT<=0){visT=.25;glintVis=(G.state==='play'||G.state==='menu')?needleVisible():null}
  glintT+=dt;const ph=(glintT%3)/.55;
  if(glintVis&&ph<1){glint.visible=true;glint.position.set(glintVis[0],glintVis[1],glintVis[2]);const k=Math.sin(ph*Math.PI);glint.scale.setScalar(.04+k*.2);glint.material.opacity=k}else glint.visible=false;
  popT-=dt;if(popT<=0){popT=.7;if(popAcc>=.005){popup('+'+money(popAcc),'cash');popAcc=0}if(recDirty)drawRecords()}
  if(G.state==='play'){aimT-=dt;if(aimT<=0){aimT=.08;updateAim()}hudT-=dt;if(hudT<=0){hudT=.1;updateHud(now)}}
  updateHand(dt,now);
  renderFrame(now);
  requestAnimationFrame(loop);
}
setTimeout(()=>{applyQuality(S.gfx,false);prepMaterials(scene);prepMaterials(vScene);buildWorld();drawPriceSign();drawRecords();renderHotbar();showTool();menu();requestAnimationFrame(loop)},30);
}
